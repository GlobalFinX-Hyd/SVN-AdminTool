name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-api:
    # Windows: the API uses DPAPI-protected keys and runs as a Windows service.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test API
        working-directory: server
        run: dotnet test --configuration Release

  build-ui:
    # Linux: on Windows the Angular CLI's esbuild service can keep `ng build` from exiting.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Use npm 11.6.0 (the version that wrote package-lock.json)
        run: npm install -g npm@11.6.0

      - name: Build UI
        working-directory: client
        run: |
          npm ci
          npx ng build --configuration production

# =====================================================================
# SvnAdmin behind Apache httpd (HTTPS reverse proxy).
#
# 1. In httpd.conf, enable:
#        LoadModule headers_module modules/mod_headers.so
#        LoadModule proxy_module modules/mod_proxy.so
#        LoadModule proxy_http_module modules/mod_proxy_http.so
# 2. Add the VirtualHost below, with your own host name and certificate paths.
# 3. Test the config, then restart Apache:
#        httpd.exe -t
#        Restart-Service Apache2.4      (or whatever your Apache service is called)
# =====================================================================

<VirtualHost *:443>
    ServerName svnadmin.example.com

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!eNULL:!MD5:!RC4:!3DES:!EXPORT
    SSLHonorCipherOrder on
    SSLCertificateFile "C:/Apache24/conf/ssl/example.com.crt"
    SSLCertificateKeyFile "C:/Apache24/conf/ssl/example.com.key"
    # SSLCertificateChainFile "C:/Apache24/conf/ssl/chain.crt"

    Header always set Strict-Transport-Security "max-age=31536000"

    # Everything goes to the SvnAdmin service, which only listens on this machine.
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:5080/ timeout=300
    ProxyPassReverse / http://127.0.0.1:5080/

    # Optional: only allow your office / VPN network to reach the admin site at all.
    # <Location />
    #     Require ip 10.0.0.0/8 192.168.0.0/16
    # </Location>
</VirtualHost>

# ---------------------------------------------------------------------
# Optional: an old password-reset host name can redirect to SvnAdmin's own page:
#
# <VirtualHost *:443>
#     ServerName svnreset.example.com
#     SSLEngine on
#     SSLProtocol -all +TLSv1.2 +TLSv1.3
#     SSLCertificateFile "C:/Apache24/conf/ssl/example.com.crt"
#     SSLCertificateKeyFile "C:/Apache24/conf/ssl/example.com.key"
#     Redirect permanent / https://svnadmin.example.com/account/forgot
# </VirtualHost>
#
# Recommended for your repository site too: use the same SSLProtocol / SSLCipherSuite /
# SSLHonorCipherOrder lines. TortoiseSVN 1.9 and later all support TLS 1.2.
# ---------------------------------------------------------------------
